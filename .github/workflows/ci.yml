name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.4", "30.1", "31.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Install dependencies from MELPA and GNU ELPA
        run: make deps
      - name: Install the C tree-sitter grammar (highlighting tests skip without it)
        continue-on-error: true
        run: >-
          emacs -Q --batch --eval '(progn (require (quote treesit))
          (when (treesit-available-p)
          (setq treesit-language-source-alist
          (quote ((c "https://github.com/tree-sitter/tree-sitter-c" "v0.21.4"))))
          (treesit-install-language-grammar (quote c))))'
      - name: Byte-compile with warnings as errors
        run: make compile
      - name: package-lint and checkdoc
        run: make lint
      - name: ERT suite (no network)
        run: make test
